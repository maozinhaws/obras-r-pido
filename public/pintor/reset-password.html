<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Redefinir senha — Pintor Plus</title>
  <style>
    :root { --bg:#f4f4f8; --ink:#0a0a0a; --ink2:#475569; --ink3:#94a3b8; --bdr:#e2e8f0; --brand:#ff6b35; --brand2:#7b5cff; }
    * { box-sizing:border-box; }
    html,body { margin:0; padding:0; font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
    .wrap { max-width:420px; margin:0 auto; padding:48px 24px; }
    h1 { font-family:'Sora',sans-serif; font-size:26px; font-weight:800; margin:0 0 8px; letter-spacing:-.5px; }
    p { color:var(--ink2); font-size:14px; line-height:1.5; margin:0 0 20px; }
    label { display:block; font-size:13px; color:#475569; font-weight:600; margin:14px 0 6px; }
    input { width:100%; height:52px; padding:0 16px; border-radius:14px; border:2px solid #64748b; background:#fff; color:#0a0a0a; font-size:16px; font-weight:700; outline:none; }
    input:focus { border-color:var(--brand); box-shadow:0 0 0 4px rgba(255,107,53,.18); }
    button.primary { width:100%; height:52px; border-radius:100px; border:none; margin-top:20px;
      background:linear-gradient(135deg,#ff6b35 0%,#7b5cff 100%); color:#fff; font-family:'Sora',sans-serif; font-size:14px; font-weight:800; letter-spacing:.4px; cursor:pointer; }
    button.primary:disabled { opacity:.6; cursor:not-allowed; }
    .msg { margin-top:16px; font-size:13px; padding:12px 14px; border-radius:12px; }
    .msg.ok { background:#dcfce7; color:#166534; }
    .msg.err { background:#fee2e2; color:#991b1b; }
    a { color:var(--brand); text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Redefinir senha</h1>
    <p>Escolha uma nova senha para sua conta. Ela precisa ter pelo menos 8 caracteres.</p>
    <form id="rp-form" onsubmit="event.preventDefault(); doReset();">
      <label for="rp-senha">Nova senha</label>
      <input id="rp-senha" type="password" autocomplete="new-password" minlength="8" required placeholder="mínimo 8 caracteres">
      <label for="rp-senha2">Confirme a nova senha</label>
      <input id="rp-senha2" type="password" autocomplete="new-password" minlength="8" required placeholder="repita a senha">
      <button class="primary" id="rp-btn" type="submit">Salvar nova senha</button>
    </form>
    <div id="rp-msg"></div>
    <p style="margin-top:32px; text-align:center;"><a href="/pintor/">Voltar para o app</a></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    let sb = null;
    async function boot() {
      try {
        const r = await fetch('/api/public/supabase-config', { cache:'no-store' });
        const cfg = await r.json();
        sb = window.supabase.createClient(cfg.url, cfg.key, {
          auth: { storage: localStorage, storageKey: 'pp-cloud-auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
        });
        // O SDK processa o hash #access_token=...&type=recovery automaticamente com detectSessionInUrl.
        const { data } = await sb.auth.getSession();
        if (!data.session) {
          showMsg('Link inválido ou expirado. Peça um novo e-mail de redefinição no app.', 'err');
          document.getElementById('rp-btn').disabled = true;
        }
      } catch (e) {
        showMsg('Falha ao carregar. Recarregue a página.', 'err');
      }
    }
    function showMsg(text, kind) {
      const el = document.getElementById('rp-msg');
      el.className = 'msg ' + (kind || 'ok');
      el.textContent = text;
    }
    async function doReset() {
      const s1 = document.getElementById('rp-senha').value;
      const s2 = document.getElementById('rp-senha2').value;
      if (s1.length < 8) return showMsg('Senha muito curta (mínimo 8 caracteres).', 'err');
      if (s1 !== s2) return showMsg('As senhas não coincidem.', 'err');
      if (!sb) return showMsg('Backend indisponível.', 'err');
      const btn = document.getElementById('rp-btn'); btn.disabled = true; btn.textContent = 'Salvando…';
      const { error } = await sb.auth.updateUser({ password: s1 });
      if (error) { btn.disabled = false; btn.textContent = 'Salvar nova senha'; return showMsg(error.message || 'Falha ao alterar senha.', 'err'); }
      showMsg('Senha alterada! Redirecionando…', 'ok');
      setTimeout(() => { window.location.href = '/pintor/'; }, 1500);
    }
    boot();
  </script>
</body>
</html>
